name: Engineering task
description: A scoped task with acceptance criteria and observed evidence
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Tests, evidence and limitations
      description: Distinguish local, simulated, cloud-tested and deployed results.
  - type: textarea
    id: learning
    attributes:
      label: Learning notes and dependencies
