name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Python quality and synthetic E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: bash scripts/local_smoke.sh
      - name: Verify generated wire contracts
        run: |
          python scripts/export_contracts.py
          git diff --exit-code -- contracts apps/web/lib/schema.d.ts
      - run: python -m pip_audit -r requirements.lock --require-hashes --disable-pip
      - name: Verify API over HTTP
        run: |
          python -m uvicorn retentionops.api:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:8000/ready
          curl --fail 'http://127.0.0.1:8000/api/v1/risk?limit=5'
  container:
    name: Container synthetic E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker compose run --rm pipeline
      - run: docker compose up --build --wait api web
      - run: curl --fail http://127.0.0.1:8000/ready
      - run: curl --fail 'http://127.0.0.1:3000/api/retention/workspace?limit=1'
      - if: always()
        run: docker compose logs api
      - if: always()
        run: docker compose down --volumes
  frontend:
    name: Analyst workspace and browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint && npm run typecheck && npm audit --audit-level=moderate
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
